name: design_forge_render
description: >-
  Flutter/dart:ui rendering layer for Design Forge. Turns a DesignRecipe into a
  ui.Image via a composable, headless (no widget tree) Canvas stage pipeline.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  design_forge:
    path: ../design_forge

dev_dependencies:
  flutter_test:
    sdk: flutter
