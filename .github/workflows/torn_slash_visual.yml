name: Torn Slash Visual

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render-seychelles:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16" | head -1 | grep -oE '[A-Z0-9-]{36}')
          xcrun simctl boot "$UDID" || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Render Seychelles torn slash with Roavvy engine
        run: |
          flutter drive \
            --driver=test_driver/design_render_capture_driver.dart \
            --target=integration_test/device/seychelles_torn_slash_capture_test.dart \
            -d "$SIM_UDID"
      - name: Decode captured PNG
        run: |
          python3 - <<'PY'
          import json, base64, pathlib
          p=pathlib.Path("../../design_studio/generated_batches/rendered_device/report.json")
          data=json.loads(p.read_text())
          d=data["designs"][0]
          out=pathlib.Path("../../design_studio/generated_batches/rendered_device/seychelles_torn_slash.png")
          out.write_bytes(base64.b64decode(d["pngBase64"]))
          print(out, out.stat().st_size)
          PY
      - name: Upload actual Roavvy render
        uses: actions/upload-artifact@v4
        with:
          name: seychelles-torn-slash-roavvy-render
          path: |
            design_studio/generated_batches/rendered_device/seychelles_torn_slash.png
            design_studio/generated_batches/rendered_device/report.json
          retention-days: 7
