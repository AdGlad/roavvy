<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Roavvy — Your Travel Story, Finally Visible</title>
    <meta name="description" content="Roavvy is a privacy-first travel discovery app in active iOS development. It uses on-device photo location metadata to build a living world map, unlock travel achievements, and create personalised travel designs without uploading private photos." />
    <meta name="keywords" content="travel map app, countries visited tracker, travel achievements, UNESCO heritage sites, world map app, travel photo scanner, travel identity, free travel app iOS" />
    <link rel="canonical" href="https://www.roavvy.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.roavvy.com/" />
    <meta property="og:title" content="Roavvy — Your Travel Story, Finally Visible" />
    <meta property="og:description" content="Privacy-first iOS travel app in active development, using on-device photo location metadata to build a living map of everywhere you've been." />
    <meta property="og:image" content="https://www.roavvy.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Roavvy" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@roavvy" />
    <meta name="twitter:title" content="Roavvy — Your Travel Story, Finally Visible" />
    <meta name="twitter:description" content="Privacy-first iOS travel app in active development with on-device travel discovery, achievements, UNESCO challenges, and personalised travel designs." />
    <meta name="twitter:image" content="https://www.roavvy.com/images/og-image.jpg" />

    <!-- App meta -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "Roavvy",
      "description": "Privacy-first travel discovery app in active iOS development that uses on-device photo location metadata to build a living world map, discover visited countries, unlock achievements, and create personalised travel designs.",
      "url": "https://www.roavvy.com",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "iOS 16.0+",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "featureList": [
        "On-device photo metadata scanning — no uploads",
        "Interactive world map of visited countries",
        "Travel achievements and milestone badges",
        "Daily UNESCO World Heritage challenges",
        "Personalised travel merchandise",
        "Privacy-first design"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Roavvy",
        "url": "https://www.roavvy.com",
        "email": "support@roavvy.com",
        "founder": {
          "@type": "Person",
          "name": "Adam Gladstone",
          "sameAs": "https://au.linkedin.com/in/adamgladstone"
        }
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
